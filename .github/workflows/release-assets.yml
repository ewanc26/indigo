name: Release assets

# Check what GitHub actually serves for a published release: the versioned
# .3dsx matches its .sha256 and update.json, and indigo.3dsx is the same file.
# This is what the console's updater will download, so a release that fails
# here must be fixed with a new patch release, never by re-tagging.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check, e.g. v0.6.0"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets
          scripts/update-manifest.sh verify "${TAG#v}" assets
