name: Release

# A release is made here, never on anyone's machine. Two ways in, the same
# steps after:
#   - workflow_dispatch with a version, for a release commit already on main
#     (scripts/release.sh --dispatch X.Y.Z does the checks and the dispatch).
#     GitHub creates the tag with this workflow's own token, because an agent's
#     sandbox may not push tags;
#   - a v* tag pushed by hand with scripts/release.sh X.Y.Z.
# The tag is never moved: a wrong release is fixed by a new patch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (x.y.z); its CHANGELOG section must be on main
        required: true
        type: string
      repair:
        description: Complete the release for an existing v<version> tag (rebuild and upload the assets); the tag is never moved
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Release check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Work out what is being released
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REPAIR: ${{ inputs.repair }}
        run: |
          repair=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              [ "$INPUT_REPAIR" = "true" ] || { echo "v$version already exists; cut a new patch instead"; exit 1; }
              repair=1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # A repair rebuilds from the commit the tag already points at; a normal
          # release uses the checked commit. The tag is never moved either way.
          if [ "$repair" = 1 ]; then
            sha="$(git rev-parse "refs/tags/v$version^{}")"
          else
            sha="$(git rev-parse HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Commit is releasable
        env:
          GH_TOKEN: ${{ github.token }}
          # main's own CI run may still be going; wait for the gate.
          RELEASE_WAIT_SECONDS: "1500"
        run: scripts/check-flow.sh release "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.sha }}"

  build:
    name: Build release assets
    needs: check
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: indigo
          fetch-depth: 0
          ref: ${{ needs.check.outputs.sha }}
      # `git describe` stamps the binary. On a dispatch the tag does not exist
      # yet, so make a local one for the build only; the real tag is created
      # by the publish job, at this same commit.
      - name: Name the build
        working-directory: indigo
        run: |
          git config --global --add safe.directory "$PWD"
          git -c user.name=ci -c user.email=ci@invalid tag -a "v${{ needs.check.outputs.version }}" -m "Indigo ${{ needs.check.outputs.version }}" || true
      - name: Wolfram pin
        id: wolfram
        run: echo "ref=$(tr -d '[:space:]' < indigo/wolfram.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: ${{ steps.wolfram.outputs.ref }}
          path: wolfram
      - name: Build Wolfram for 3DS
        working-directory: indigo
        run: make wolfram-3ds
      - name: Build Indigo from the tag
        working-directory: indigo
        run: |
          git config --global --add safe.directory "$PWD"
          make
          test -f indigo.3dsx
      - name: Update assets
        working-directory: indigo
        run: |
          v="${{ needs.check.outputs.version }}"
          scripts/update-manifest.sh make "$v" indigo.3dsx release
          cp indigo.3dsx release/indigo.3dsx
          scripts/update-manifest.sh verify "$v" release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: indigo/release/

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      # The manifest is signed before the release exists, so there is never a
      # published release without update.json.sig. The key is the repository
      # secret UPDATE_SIGNING_KEY; scripts/sign-manifest.sh never prints it and
      # checks its own signature against src/update/update_key.h first.
      - name: Sign update.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: scripts/sign-manifest.sh sign release/update.json release/update.json.sig
      - name: Create or complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          scripts/release-notes.sh "$v" > "$RUNNER_TEMP/notes.md"
          # The release is created before its assets are uploaded, so an
          # interrupted publish leaves an empty release behind. Complete that
          # one instead of failing, from the same tag. Otherwise --target makes
          # GitHub create the tag v$v at the checked commit; on a tag push the
          # tag already exists and --target is ignored.
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" \
              release/indigo.3dsx "release/indigo-$v.3dsx" "release/indigo-$v.3dsx.sha256" release/update.json release/update.json.sig \
              --clobber
            gh release edit "v$v" --title "Indigo $v" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "v$v" --target "${{ needs.check.outputs.sha }}" --title "Indigo $v" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              release/indigo.3dsx "release/indigo-$v.3dsx" "release/indigo-$v.3dsx.sha256" release/update.json release/update.json.sig
          fi
      - name: Verify what GitHub serves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir served
          gh release download "v${{ needs.check.outputs.version }}" --dir served
          scripts/update-manifest.sh verify "${{ needs.check.outputs.version }}" served
          scripts/sign-manifest.sh verify served/update.json served/update.json.sig
