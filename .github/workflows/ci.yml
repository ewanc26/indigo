name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # Indigo's own checks; see CONTRIBUTING.md. The shared branch, title, body
  # and commit rules are flow / conventions (.github/workflows/flow.yml).
  # scripts/check-flow-selftest.sh proves each check here can fail.
  checks:
    name: Indigo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checks can fail
        run: scripts/check-flow-selftest.sh
      - name: Docs have not drifted
        run: scripts/check-flow.sh drift
      - name: Generated art is current
        run: python3 tools/gen_logo.py --check
      - name: Universal-DB listing is current
        run: python3 scripts/udb-listing.py --check
      - name: No protocol code outside Wolfram
        run: scripts/check-flow.sh protocol

  host:
    name: Host tests and warnings sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make warnings
      - run: make snapshots
      - name: Universal-DB submission builds
        run: scripts/udb-submit.sh --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: layout-snapshots
          path: build-host/snapshots/*.png

  build-3ds:
    name: 3DS build (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: indigo
      # Indigo builds against the Wolfram release named in wolfram.ref, never
      # Wolfram's main. Bumping it is a PR like any other.
      - name: Wolfram pin
        id: wolfram
        run: echo "ref=$(tr -d '[:space:]' < indigo/wolfram.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: ${{ steps.wolfram.outputs.ref }}
          path: wolfram
      - name: Build Wolfram for 3DS
        working-directory: indigo
        run: make wolfram-3ds
      - name: Build Indigo
        working-directory: indigo
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: indigo-3dsx
          path: indigo/indigo.3dsx

  # The one status branch protection should require. It fails if any job it
  # waits on failed or was cancelled, so adding a job to `needs` is how a new
  # check becomes mandatory without touching repository settings.
  gate:
    name: CI gate
    if: always()
    needs: [checks, host, build-3ds]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1;; esac
