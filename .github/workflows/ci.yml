name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # Indigo's own checks; see CONTRIBUTING.md. The shared branch, title, body
  # and commit rules are flow / conventions (.github/workflows/flow.yml).
  # scripts/check-flow-selftest.sh proves each check here can fail.
  checks:
    name: Indigo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checks can fail
        run: scripts/check-flow-selftest.sh
      - name: Docs have not drifted
        run: scripts/check-flow.sh drift
      - name: Generated art is current
        run: python3 tools/gen_logo.py --check
      - name: Universal-DB listing is current
        run: python3 scripts/udb-listing.py --check
      - name: No protocol code outside Wolfram
        run: scripts/check-flow.sh protocol

  host:
    name: Host tests and warnings sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: indigo
      # The host build links Wolfram's muted-word matcher, time parser, CDN URL
      # rewrite and update-signature check, so it needs the Wolfram release named
      # in wolfram.ref beside this checkout, and cJSON's headers.
      - name: Wolfram pin
        id: wolfram
        run: echo "ref=$(tr -d '[:space:]' < indigo/wolfram.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: ${{ steps.wolfram.outputs.ref }}
          path: wolfram
      - name: cJSON headers and Wolfram's host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libcjson-dev \
            libcurl4-openssl-dev libssl-dev libsecp256k1-dev
      - run: make test
        working-directory: indigo
      # The end-to-end harness runs the real session worker against a mock PDS
      # on the loopback interface, so it needs Wolfram built for the host with
      # its whole agent surface rather than the few sources `make test` links.
      - name: Build Wolfram for the host
        run: |
          cmake -S wolfram -B wolfram/build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOLFRAM_BUILD_TESTS=OFF \
            -DWOLFRAM_BUILD_EXAMPLES=OFF
          cmake --build wolfram/build-host --target wolfram -j"$(nproc)"
      - run: make e2e
        working-directory: indigo
      - run: make warnings
        working-directory: indigo
      - run: make snapshots
        working-directory: indigo
      - name: Universal-DB submission builds
        run: scripts/udb-submit.sh --dry-run
        working-directory: indigo
      - uses: actions/upload-artifact@v4
        with:
          name: layout-snapshots
          path: indigo/build-host/snapshots/*.png

  build-3ds:
    name: 3DS build (devkitARM)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: indigo
      # Indigo builds against the Wolfram release named in wolfram.ref, never
      # Wolfram's main. Bumping it is a PR like any other.
      - name: Wolfram pin
        id: wolfram
        run: echo "ref=$(tr -d '[:space:]' < indigo/wolfram.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: ${{ steps.wolfram.outputs.ref }}
          path: wolfram
      - name: Build Wolfram for 3DS
        working-directory: indigo
        run: make wolfram-3ds
      - name: Build Indigo
        working-directory: indigo
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: indigo-3dsx
          path: indigo/indigo.3dsx

  # macOS is a host platform, not an afterthought: the e2e harness failed to
  # compile there because Darwin hides INADDR_LOOPBACK under the strict POSIX
  # level the harness asks for, and the Linux job could not see it. This leg
  # runs the same host targets as `host`, so a Darwin-only break fails the PR
  # instead of the next run on a Mac.
  host-macos:
    name: macOS host tests, warnings and e2e
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: indigo
      - name: Wolfram pin
        id: wolfram
        run: echo "ref=$(tr -d '[:space:]' < indigo/wolfram.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ewanc26/wolfram
          ref: ${{ steps.wolfram.outputs.ref }}
          path: wolfram
      # Homebrew's cJSON is keg-only: its headers are under cjson/, not on the
      # default include path, and it ships no libcjson.pc the build can find.
      # Point the host build at the keg explicitly rather than relying on
      # pkg-config resolving a formula that is not linked.
      - name: Dependencies
        run: |
          brew install cjson secp256k1
          {
            echo "HOST_CJSON_CFLAGS=-I$(brew --prefix cjson)/include/cjson"
            echo "HOST_CJSON_LIBS=-L$(brew --prefix cjson)/lib -lcjson"
          } >> "$GITHUB_ENV"
      - name: Build Wolfram for the host
        run: |
          cmake -S wolfram -B wolfram/build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DWOLFRAM_BUILD_TESTS=OFF \
            -DWOLFRAM_BUILD_EXAMPLES=OFF
          cmake --build wolfram/build-host --target wolfram -j"$(sysctl -n hw.ncpu)"
      - run: make test
        working-directory: indigo
      - run: make warnings
        working-directory: indigo
      - run: make snapshots
        working-directory: indigo
      - run: make e2e
        working-directory: indigo

  # The one status branch protection should require. It fails if any job it
  # waits on failed or was cancelled, so adding a job to `needs` is how a new
  # check becomes mandatory without touching repository settings.
  gate:
    name: CI gate
    if: always()
    needs: [checks, host, host-macos, build-3ds]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*|*" skipped "*) exit 1;; esac
