name: Feature or parity request
description: Something Indigo should do, or a gap against Cobalt
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in the first person, as the owner: plain British English, dry and specific ("I've found...", "I want..."). An issue written by an agent ends with the line `_Written by Claude on my behalf._`
  - type: textarea
    id: what
    attributes:
      label: What should it do, and how would it work on a 3DS?
      description: Say what the right interaction is on two screens, not just what another client does.
    validations: {required: true}
