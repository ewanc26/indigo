name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: input
    id: build
    attributes:
      label: Build
      description: The build line on the settings screen (commit and number).
    validations: {required: true}
  - type: dropdown
    id: where
    attributes:
      label: Where it happened
      options: [Real 3DS hardware, Emulator, Host tests or snapshots]
    validations: {required: true}
